[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelasoc"
version = "1.0.0"
description = "AI copilot for Security Operations Centers: RAG over internal security docs + natural-language analytics over incident data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SentinelaSOC authors" }]
keywords = ["soc", "security-operations", "rag", "llm", "duckdb", "chromadb", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "streamlit>=1.36",
    "duckdb>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/oness24/sentinelasoc"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelasoc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app.py", "ingest.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]  # ternary nem sempre melhora a leitura

[tool.ruff.lint.per-file-ignores]
# prosa de prompt e esquema textual: quebrar linhas mudaria o conteudo enviado ao LLM
"src/sentinelasoc/prompts.py" = ["E501"]
"src/sentinelasoc/db.py" = ["E501"]
# CSS/HTML injetados na interface Streamlit
"app.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que carregam modelo de embeddings e indice vetorial local",
    "e2e: testes que exigem OPENAI_API_KEY configurada",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["src/sentinelasoc"]
