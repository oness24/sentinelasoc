name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, tipos e testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Formatacao (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy

      - name: Testes unitarios
        run: pytest -m "not integration and not e2e" -q
        env:
          OPENAI_API_KEY: ""  # testes unitarios rodam sem chave

  integration:
    name: Testes de integracao (RAG local)
    runs-on: ubuntu-latest
    continue-on-error: true  # dependem de download de modelo; falha nao bloqueia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Indexar documentos
        run: python ingest.py

      - name: Testes de integracao
        run: pytest -m integration -q
